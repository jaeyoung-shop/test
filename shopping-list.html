<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 집 장보기</title>
<style>
  :root {
    --bg: #fff8ef;
    --text: #4a3f4f;
    --muted: #9a8f9e;
    --accent: #f48fb1;
    --accent-dark: #d96b93;
    --white: #ffffff;
    --shadow: 0 4px 14px rgba(180, 140, 160, 0.18);
    --veg: #e3f6d8;   --veg-line: #a8d98f;
    --meat: #ffe0e6;  --meat-line: #f4a3b6;
    --dairy: #fff3c4; --dairy-line: #f1d36b;
    --home: #dcefff;  --home-line: #8cc4f0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { text-align: center; font-size: 2rem; margin: 0 0 20px; }

  .panel {
    background: var(--white);
    border-radius: 24px;
    box-shadow: var(--shadow);
    padding: 18px 20px;
    margin-bottom: 20px;
  }
  .progress-text { font-weight: 700; margin-bottom: 10px; }
  .progress-bar { height: 16px; background: #f6e9f0; border-radius: 999px; overflow: hidden; }
  .progress-fill {
    height: 100%; width: 0;
    background: linear-gradient(90deg, #f8bbd0, #b3e5fc, #c5e1a5);
    border-radius: 999px;
    transition: width .3s ease;
  }

  form.add { display: flex; gap: 8px; flex-wrap: wrap; }
  form.add input, form.add select {
    font: inherit; color: var(--text);
    border: 2px solid #f3d6e3; border-radius: 999px;
    padding: 10px 16px; background: #fffafc; outline: none;
  }
  form.add input { flex: 1 1 200px; min-width: 0; }
  form.add input:focus, form.add select:focus { border-color: var(--accent); }
  button {
    font: inherit; cursor: pointer; border: none; border-radius: 999px;
  }
  .btn {
    background: var(--accent); color: #fff; font-weight: 700; padding: 10px 22px;
  }
  .btn:hover { background: var(--accent-dark); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 18px;
  }
  .card {
    border-radius: 24px; padding: 16px 16px 10px;
    box-shadow: var(--shadow); border: 2px solid transparent;
  }
  .card h2 { font-size: 1.15rem; margin: 0 0 10px; display: flex; justify-content: space-between; }
  .card h2 small { font-weight: 400; color: var(--muted); font-size: .85rem; }
  .card[data-cat="veg"]   { background: var(--veg);   border-color: var(--veg-line); }
  .card[data-cat="meat"]  { background: var(--meat);  border-color: var(--meat-line); }
  .card[data-cat="dairy"] { background: var(--dairy); border-color: var(--dairy-line); }
  .card[data-cat="home"]  { background: var(--home);  border-color: var(--home-line); }

  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex; align-items: center; gap: 10px;
    background: rgba(255,255,255,.75);
    border-radius: 16px; padding: 8px 10px; margin-bottom: 8px;
  }
  li label { flex: 1; display: flex; align-items: center; gap: 10px; cursor: pointer; min-width: 0; }
  li label span { overflow-wrap: anywhere; }
  li input[type="checkbox"] {
    appearance: none; -webkit-appearance: none;
    width: 22px; height: 22px; flex-shrink: 0; margin: 0;
    border-radius: 50%; border: 2px solid var(--accent); background: #fff;
    display: grid; place-content: center; cursor: pointer;
  }
  li input[type="checkbox"]::after {
    content: "✓"; color: #fff; font-size: 14px; font-weight: 700; transform: scale(0); transition: transform .15s;
  }
  li input[type="checkbox"]:checked { background: var(--accent); }
  li input[type="checkbox"]:checked::after { transform: scale(1); }
  li.done span { text-decoration: line-through; color: var(--muted); }
  li.done { opacity: .7; }
  .del {
    background: transparent; color: var(--muted); width: 28px; height: 28px; flex-shrink: 0;
  }
  .del:hover { background: #fde4ec; color: var(--accent-dark); }
  .empty { color: var(--muted); font-size: .9rem; padding: 4px 4px 12px; }

  .reset-row { text-align: center; margin-top: 28px; }
  .btn-reset {
    background: var(--white); color: var(--accent-dark); font-weight: 700;
    border: 2px solid var(--accent); padding: 12px 28px; box-shadow: var(--shadow);
  }
  .btn-reset:hover { background: #fde4ec; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🛒 우리 집 장보기</h1>

  <div class="panel">
    <div class="progress-text" id="progressText"></div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <div class="panel">
    <form class="add" id="addForm">
      <input id="newName" type="text" placeholder="새 항목 이름 (예: 바나나)" maxlength="40" autocomplete="off">
      <select id="newCat" aria-label="카테고리"></select>
      <button class="btn" type="submit">추가</button>
    </form>
  </div>

  <div class="grid" id="grid"></div>

  <div class="reset-row">
    <button class="btn-reset" id="resetBtn" type="button">🔄 체크 모두 풀기</button>
  </div>
</div>

<script>
  const STORAGE_KEY = "our-home-shopping-list-v1";

  const CATEGORIES = [
    { id: "veg",   name: "🥬 채소·과일" },
    { id: "meat",  name: "🥩 고기·생선" },
    { id: "dairy", name: "🥛 유제품·달걀" },
    { id: "home",  name: "🧻 생활용품" }
  ];

  const DEFAULT_ITEMS = {
    veg:   ["대파", "양파", "감자", "사과"],
    meat:  ["돼지고기", "닭가슴살", "고등어"],
    dairy: ["우유", "계란", "두부", "치즈"],
    home:  ["휴지", "주방세제", "쓰레기봉투"]
  };

  let nextId = 1;
  function makeDefaults() {
    const items = [];
    for (const cat of CATEGORIES) {
      for (const name of DEFAULT_ITEMS[cat.id]) {
        items.push({ id: nextId++, name, cat: cat.id, done: false });
      }
    }
    return items;
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const items = JSON.parse(raw);
        if (Array.isArray(items)) {
          nextId = items.reduce((m, it) => Math.max(m, it.id), 0) + 1;
          return items;
        }
      }
    } catch (e) {}
    return makeDefaults();
  }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); } catch (e) {}
  }

  let items = load();

  const grid = document.getElementById("grid");
  const newName = document.getElementById("newName");
  const newCat = document.getElementById("newCat");

  for (const cat of CATEGORIES) {
    const opt = document.createElement("option");
    opt.value = cat.id;
    opt.textContent = cat.name;
    newCat.appendChild(opt);
  }

  function render() {
    grid.innerHTML = "";
    for (const cat of CATEGORIES) {
      const list = items.filter(it => it.cat === cat.id);
      // 안 산 것 먼저, 산 것은 아래로 (각 그룹 안에서는 추가한 순서 유지)
      const sorted = [...list.filter(it => !it.done), ...list.filter(it => it.done)];
      const doneCount = list.filter(it => it.done).length;

      const card = document.createElement("section");
      card.className = "card";
      card.dataset.cat = cat.id;

      const h2 = document.createElement("h2");
      h2.textContent = cat.name;
      const small = document.createElement("small");
      small.textContent = `${doneCount}/${list.length}`;
      h2.appendChild(small);
      card.appendChild(h2);

      const ul = document.createElement("ul");
      if (sorted.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "아직 항목이 없어요";
        card.appendChild(empty);
      }
      for (const it of sorted) {
        const li = document.createElement("li");
        if (it.done) li.className = "done";

        const label = document.createElement("label");
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = it.done;
        cb.addEventListener("change", () => {
          it.done = cb.checked;
          save();
          render();
        });
        const span = document.createElement("span");
        span.textContent = it.name;
        label.append(cb, span);

        const del = document.createElement("button");
        del.className = "del";
        del.type = "button";
        del.textContent = "✕";
        del.title = "삭제";
        del.setAttribute("aria-label", `${it.name} 삭제`);
        del.addEventListener("click", () => {
          items = items.filter(x => x.id !== it.id);
          save();
          render();
        });

        li.append(label, del);
        ul.appendChild(li);
      }
      card.appendChild(ul);
      grid.appendChild(card);
    }
    renderProgress();
  }

  function renderProgress() {
    const total = items.length;
    const done = items.filter(it => it.done).length;
    const pct = total ? Math.round((done / total) * 100) : 0;
    document.getElementById("progressText").textContent =
      total === 0 ? "목록이 비어 있어요"
      : done === total ? `🎉 ${total}개 모두 샀어요!`
      : `${total}개 중 ${done}개 샀어요 (${pct}%)`;
    document.getElementById("progressFill").style.width = pct + "%";
  }

  document.getElementById("addForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const name = newName.value.trim();
    if (!name) { newName.focus(); return; }
    items.push({ id: nextId++, name, cat: newCat.value, done: false });
    save();
    render();
    newName.value = "";
    newName.focus();
  });

  document.getElementById("resetBtn").addEventListener("click", () => {
    if (!items.some(it => it.done)) return;
    if (confirm("체크한 것을 모두 풀까요? 항목은 그대로 남아요.")) {
      items.forEach(it => it.done = false);
      save();
      render();
    }
  });

  render();
</script>
</body>
</html>
